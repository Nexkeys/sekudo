# Sekudo operator config.
#
# Copy this to `sekudo.config.yaml` (which is gitignored) and edit.
# Sekudo refuses to scan anything not listed here.

# Attestation. By setting this to true you confirm every host in
# authorized_targets is one you OWN or are EXPLICITLY AUTHORIZED to test.
# Testing systems without authorization is illegal. Leave false to hard-stop.
i_am_authorized: false

# Hosts Sekudo may test. Supports:
#   - exact host:        app.example.com
#   - suffix wildcard:   *.staging.example.com
#   - CIDR (lab nets):   10.0.0.0/24
authorized_targets:
  - localhost
  - 127.0.0.1
  # - staging.yourcompany.com
  # - "*.lab.yourcompany.internal"
  # - 192.168.56.0/24

# Aggression ceilings (raise for your own lab; defaults stay polite enough
# not to knock a target over by accident).
max_requests_per_scan: 2000
requests_per_second: 20.0

# Allow scanning RFC1918 / loopback (your own lab hosts usually need this).
allow_private_ranges: true
